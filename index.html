<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>Lemberg Cup — P-Screen</title>
<style>
  body { margin: 0; background: #061a0f; color: #fff; font-family: "Poppins", sans-serif; overflow: hidden; }
  #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
  
  /* Букви */
  .letter {
    font-size: 45px; font-weight: 900; text-transform: uppercase;
    color: transparent; 
    background: linear-gradient(90deg, #ffb7d9, #fff, #ffb7d9);
    background-size: 200% 100%;
    background-clip: text;
    -webkit-background-clip: text;
    text-shadow: 0 0 10px rgba(255,183,217,0.5);
    animation: sweep 3s infinite linear;
  }
  @keyframes sweep { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  
  .p-screen { display: grid; grid-template-columns: 168px 672px 168px; grid-template-rows: 168px 672px; width: 1008px; height: 840px; margin: 0 auto; z-index: 1; position: relative; }
  .side-zone { display: flex; flex-direction: column; align-items: center; padding: 20px 0 30px 0; height: 672px; }
  .text-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; width: 168px; }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="p-screen">
  <div class="side-zone"><div class="text-wrapper" id="word1"></div></div>
  <div class="center-zone"></div>
  <div class="side-zone"><div class="text-wrapper" id="word2"></div></div>
</div>

<script>
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d', { alpha: false }); // Оптимізація: відключення прозорості canvas
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Зменшуємо кількість до 400 (це оптимально для візуальної "обильності" без перевантаження)
const particles = Array.from({length: 400}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 2 + 1,
    speed: Math.random() * 0.5 + 0.1
}));

function draw() {
    ctx.fillStyle = '#061a0f'; // Заливка фону
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    particles.forEach(p => {
        p.y -= p.speed;
        if (p.y < 0) p.y = canvas.height;
        
        ctx.fillStyle = '#00ff41';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#00ff41';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
    requestAnimationFrame(draw);
}
draw();

// Логіка відображення тексту
function renderWord(id, word) {
    const cont = document.getElementById(id);
    cont.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center;">` +
        word.split('').map(c => `<div class="letter">${c}</div>`).join('') + `</div>`;
}
// (loadData як раніше)
</script>
</body>
</html>
