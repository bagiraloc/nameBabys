<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>Lemberg Cup — P-Screen</title>
<style>
  body { margin: 0; background: #061a0f; color: #fff; font-family: "Poppins", sans-serif; overflow: hidden; }

  /* Фон з зірками */
  body::after {
    content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0;
    background-image: 
      radial-gradient(1.5px 1.5px at 10% 10%, #FFD700, transparent),
      radial-gradient(1px 1px at 30% 60%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 80% 20%, #FFD700, transparent);
    background-size: 400px 400px;
    animation: starTwinkle 4s infinite alternate;
  }
  @keyframes starTwinkle { 0% { opacity: 0.3; } 100% { opacity: 1; } }

  .p-screen {
    display: grid;
    grid-template-columns: 168px 672px 168px;
    grid-template-rows: 168px 672px;
    width: 1008px; height: 840px; margin: 0 auto; position: relative; z-index: 1;
  }

  /* 1. РОЖЕВА ПЛОЩИНА (Верх) */
  .top-zone { grid-column: 1 / 4; display: flex; align-items: center; justify-content: center; position: relative; }
  .logo-top { max-height: 140px; width: auto; }
  .copyright { 
    position: absolute; right: 20px; top: 10px; 
    font-size: 12px; color: #ffffff; opacity: 0.6; 
  }

  /* 2. ЗЕЛЕНІ ПЛОЩИНИ (Боки) */
  .side-zone { 
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 40px 10px; 
  }
  
  /* Горизонтальний текст (буква під буквою) */
  .text-stack { 
    font-weight: 900; color: #eb8eb7; text-transform: uppercase;
    font-size: 35px; text-align: center; line-height: 1.1;
    word-break: break-word;
  }
  
  .logo-side { width: 120px; }
</style>
</head>
<body>

<div class="p-screen">
  <div class="top-zone">
    <img src="Lemberg Cup.png" class="logo-top" alt="Logo">
    <div class="copyright">© 2026 EstEvents by Емма Щелецька</div>
  </div>

  <div class="side-zone">
    <div class="text-stack" id="name-field">ЗАВАНТАЖЕННЯ...</div>
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>

  <div class="center-zone"></div>

  <div class="side-zone">
    <div class="text-stack" id="club-field"></div>
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyhuV7wnJIyk0oSdbLR1_np0DS47acXlRAnwTEV7MczrJlfn9GZvOMRTNYkjYciKdFu/exec";

// Функція для розбиття тексту на рядки (буква під буквою)
function formatVertical(text) {
    return text.split('').join('<br>');
}

async function loadData() {
  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    const data = await res.json();
    document.getElementById("name-field").innerHTML = formatVertical(data[0] || "");
    document.getElementById("club-field").innerHTML = formatVertical(data[1] || "");
  } catch (e) { console.error("Error:", e); }
}
setInterval(loadData, 3000);
loadData();
</script>
</body>
</html>
