<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sportart Rhythmic — NAME & CLUB</title>
<style>
body {
  margin: 0;
  padding: 0;
  font-family: "Poppins", sans-serif;
  background: radial-gradient(circle at top, #1a082b 0%, #0c0215 100%);
  color: #ffffff;
  display: flex;
  flex-direction: column;
  justify-content: center; 
  align-items: center;
  height: 100vh;
  text-align: center;
  overflow: hidden;
  position: relative; /* Для позиціонування блискіток */
}

/* --- ЕФЕКТ БЛИСКІТОК (ФОН) --- */
.particle-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none; /* Щоб не заважали мишці */
  z-index: 1; /* Фон */
}

.particle {
  position: absolute;
  background-color: #f6c453; /* Золотистий колір */
  border-radius: 50%;
  opacity: 0;
  animation: fallParticles linear infinite;
  filter: blur(1px); /* Легке розмиття для магічного ефекту */
}

/* Анімація падіння та згасання */
@keyframes fallParticles {
  0% { transform: translateY(-10px) rotate(0deg); opacity: 0; }
  10% { opacity: 0.8; } /* Швидко з'являються */
  90% { opacity: 0.8; } /* Тримають яскравість */
  100% { transform: translateY(110vh) rotate(360deg); opacity: 0; } /* Падають вниз і згасають */
}
/* --- КІНЕЦЬ БЛИСКІТОК --- */

header {
  position: absolute;
  top: 40px;
  animation: fadeIn 1.5s ease-in-out;
  z-index: 10; /* Поверх фону */
}

.header-logo {
  width: 450px; 
  height: auto;
  filter: drop-shadow(0 0 15px rgba(194, 153, 255, 0.4));
}

.logo-estevents {
  position: fixed;
  bottom: 25px;
  right: 25px;
  width: 130px;
  height: auto;
  z-index: 1000;
  opacity: 0.8;
}

.scoreboard {
  background: rgba(255, 255, 255, 0.05);
  border: 4px solid rgba(200, 150, 255, 0.5); 
  border-radius: 40px;
  padding: 60px 40px; 
  box-shadow: 0 0 60px rgba(160, 80, 255, 0.2);
  backdrop-filter: blur(15px);
  min-width: 85%; 
  display: flex;
  flex-direction: column;
  justify-content: center; 
  transition: filter 0.5s ease-in-out;
  z-index: 10; /* Поверх фону */
}

.cell-container {
  display: flex;
  flex-direction: column;
  gap: 30px; 
}

.cell {
  color: #ffffff; 
  font-weight: 900; 
  line-height: 1.2;
  text-shadow: 4px 4px 20px rgba(0, 0, 0, 0.6);
  animation: fadeUp 0.6s ease-out forwards;
}

.name-row {
  font-size: 7em; 
  text-transform: uppercase;
  letter-spacing: 3px;
}

.club-row {
  font-size: 4.5em; 
  color: #ffffff; 
  opacity: 0.95; 
}

footer {
  position: absolute;
  bottom: 20px;
  color: #bdaaff;
  font-size: 1.2em; 
  font-weight: 600;
  opacity: 0.7;
  z-index: 10;
}

@keyframes fadeUp {
  0% { transform: translateY(30px); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 768px) {
  .header-logo { width: 220px; }
  .name-row { font-size: 2.8em; }
  .club-row { font-size: 1.8em; }
  .scoreboard { padding: 30px; }
}
</style>
</head>
<body>

<div class="particle-container" id="particleContainer"></div>

<header>
  <img src="https://estevents.github.io/sportart/logo_sportart.png.jpg" alt="Sport Art Cup" class="header-logo">
</header>

<img src="https://estevents.github.io/sportart/logo_estevents.png.png" alt="EstEvents Logo" class="logo-estevents">

<div class="scoreboard" id="scoreboard">
  <div id="content" class="cell-container">
    <div class="cell">ЗАВАНТАЖЕННЯ...</div>
  </div>
</div>

<footer>© 2026 EstEvents by Емма Щелецька</footer>

<script>
// --- СКРИПТ ДЛЯ ГЕНЕРАЦІЇ БЛИСКІТОК ---
function createParticles() {
  const container = document.getElementById('particleContainer');
  const particleCount = 50; // Кількість блискіток на екрані

  for (let i = 0; i < particleCount; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    
    // Випадковий розмір (від 2 до 5 пікселів)
    const size = Math.random() * 3 + 2;
    particle.style.width = size + 'px';
    particle.style.height = size + 'px';
    
    // Випадкова позиція по горизонталі
    particle.style.left = Math.random() * 100 + 'vw';
    
    // Випадкова затримка анімації (щоб сипалися не одночасно)
    particle.style.animationDelay = Math.random() * 10 + 's';
    
    // Випадкова тривалість падіння (від 5 до 15 секунд)
    particle.style.animationDuration = Math.random() * 10 + 5 + 's';
    
    container.appendChild(particle);
  }
}

// Запускаємо генерацію блискіток при завантаженні
createParticles();
// -------------------------------------


const API_URL = "https://script.google.com/macros/s/AKfycbyhuV7wnJIyk0oSdbLR1_np0DS47acXlRAnwTEV7MczrJlfn9GZvOMRTNYkjYciKdFu/exec";
let lastData = "";

async function loadData() {
  const scoreboard = document.getElementById("scoreboard");
  const content = document.getElementById("content");

  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    if (!res.ok) return;

    const data = await res.json();
    if (!Array.isArray(data)) return;

    // Беремо тільки B3 (data[0]) та C3 (data[1])
    const name = String(data[0] || "").trim();
    const club = String(data[1] || "").trim();

    const newData = name + club;
    if (newData === lastData) return;
    lastData = newData;

    scoreboard.style.filter = "blur(10px)";

    setTimeout(() => {
      content.innerHTML = `
        <div class="cell name-row">${name || "—"}</div>
        <div class="cell club-row">${club || "—"}</div>
      `;
      scoreboard.style.filter = "blur(0)";
    }, 400);

  } catch (e) { console.error("Error", e); }
}

loadData();
setInterval(loadData, 3000);
</script>

</body>
</html>
