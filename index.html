<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sportart Rhythmic — NAME & CLUB</title>
<style>
body {
  margin: 0;
  padding: 0;
  font-family: "Poppins", sans-serif;
  background: radial-gradient(circle at top, #1a082b 0%, #0c0215 100%);
  color: #ffffff;
  display: flex;
  flex-direction: column;
  justify-content: center; /* Центруємо вертикально */
  align-items: center;
  height: 100vh;
  text-align: center;
  overflow: hidden;
}

header {
  position: absolute; /* Логотип зверху */
  top: 20px;
  animation: fadeIn 1.5s ease-in-out;
}

.header-logo {
  width: 400px; 
  height: auto;
  filter: drop-shadow(0 0 15px rgba(194, 153, 255, 0.4));
}

.logo-estevents {
  position: fixed;
  bottom: 25px;
  right: 25px;
  width: 130px;
  height: auto;
  z-index: 1000;
  opacity: 0.8;
}

.scoreboard {
  background: rgba(255, 255, 255, 0.05);
  border: 4px solid rgba(200, 150, 255, 0.5); 
  border-radius: 40px;
  padding: 50px 80px; 
  box-shadow: 0 0 60px rgba(160, 80, 255, 0.2);
  backdrop-filter: blur(15px);
  min-width: 80%; 
  display: flex;
  flex-direction: column;
  justify-content: center; 
  transition: filter 0.5s ease-in-out;
}

.cell-container {
  display: flex;
  flex-direction: column;
  gap: 20px; 
}

.cell {
  color: #ffffff;
  font-weight: 900; 
  line-height: 1.1;
  text-shadow: 3px 3px 15px rgba(0, 0, 0, 0.5);
  animation: fadeUp 0.6s ease-out forwards;
}

/* Стиль для Імені (B3) */
.cell:first-child {
  font-size: 6.5em; /* Дуже велике ім'я */
  color: #ffffff;
  text-transform: uppercase;
  letter-spacing: 2px;
}

/* Стиль для Клубу/Команди (C3) */
.cell:last-child {
  font-size: 4em; /* Трохи менше за ім'я */
  color: #f6c453; /* Золотистий колір для контрасту */
  opacity: 0.9;
}

footer {
  position: absolute;
  bottom: 20px;
  color: #bdaaff;
  font-size: 1.2em; 
  font-weight: 600;
  opacity: 0.7;
}

@keyframes fadeUp {
  0% { transform: translateY(20px); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 768px) {
  .header-logo { width: 220px; }
  .cell:first-child { font-size: 2.5em; }
  .cell:last-child { font-size: 1.8em; }
  .scoreboard { padding: 30px; }
}
</style>
</head>
<body>

<header>
  <img src="logo_sportart.png.jpg" alt="Sport Art Cup" class="header-logo">
</header>

<img src="logo_estevents.png.png" alt="EstEvents Logo" class="logo-estevents">

<div class="scoreboard" id="scoreboard">
  <div id="content" class="cell-container">
    <div class="cell">ОЧІКУВАННЯ...</div>
  </div>
</div>

<footer>© 2026 EstEvents by Емма Щелецька</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyhuV7wnJIyk0oSdbLR1_np0DS47acXlRAnwTEV7MczrJlfn9GZvOMRTNYkjYciKdFu/exec";
let lastData = "";

async function loadData() {
  const scoreboard = document.getElementById("scoreboard");
  const content = document.getElementById("content");

  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    if (!res.ok) return;

    const data = await res.json();
    if (!Array.isArray(data)) return;

    // Беремо лише перші дві клітинки (Ім'я та Команда)
    const fixedRow = data.map(v => {
      let val = String(v).trim();
      return (val === "" || val === undefined) ? "—" : val;
    });

    const newData = JSON.stringify(fixedRow);
    if (newData === lastData) return;
    lastData = newData;

    scoreboard.style.filter = "blur(10px)";

    setTimeout(() => {
      content.innerHTML = fixedRow.map((v, i) => 
        `<div class="cell" style="animation-delay: ${i * 0.1}s">${v}</div>`
      ).join('');
      scoreboard.style.filter = "blur(0)";
    }, 400);

  } catch (e) { console.error("Error", e); }
}

loadData();
setInterval(loadData, 3000); // Оновлення раз на 3 секунди
</script>

</body>
</html>
