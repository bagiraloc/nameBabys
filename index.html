<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>Lemberg Cup — P-Screen</title>
<style>
  body { margin: 0; background: #061a0f; color: #fff; font-family: "Poppins", sans-serif; overflow: hidden; }
  
  #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

  /* СТИЛЬ БУКВ: СВІТОВИЙ ОБ'ЄКТ */
  .letter {
    display: flex; justify-content: center; align-items: center;
    width: 100%; font-size: 45px; font-weight: 900;
    text-transform: uppercase;
    color: #ffb7d9; /* Світло-рожевий колір */
    
    /* Ореол (Outer Glow) та пульсація */
    text-shadow: 0 0 10px #ffb7d9, 0 0 20px #ff007f;
    animation: pulse 2s infinite alternate;
    
    /* Блік (Light Sweep) */
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    background-size: 200% 100%;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent; /* Ховаємо колір для ефекту блиску */
    animation: pulse 2s infinite alternate, sweep 4s infinite linear;
  }

  @keyframes pulse {
    from { text-shadow: 0 0 10px #ffb7d9, 0 0 20px #ff007f; }
    to { text-shadow: 0 0 20px #ffb7d9, 0 0 40px #ff007f; }
  }

  @keyframes sweep {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Решта стилів залишається без змін */
  .p-screen { display: grid; grid-template-columns: 168px 672px 168px; grid-template-rows: 168px 672px; width: 1008px; height: 840px; margin: 0 auto; position: relative; z-index: 1; }
  .side-zone { display: flex; flex-direction: column; align-items: center; padding: 20px 0 30px 0; height: 672px; box-sizing: border-box; }
  .text-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; width: 168px; overflow: hidden; }
  .word-stack { display: flex; flex-direction: column; align-items: center; width: 100%; }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="p-screen">
  <div class="side-zone"><div class="text-wrapper" id="word1"></div></div>
  <div class="center-zone"></div>
  <div class="side-zone"><div class="text-wrapper" id="word2"></div></div>
</div>

<script>
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Збільшено кількість частинок у 3 рази (було 300, стало 900)
const particles = Array.from({length: 900}, () => ({
    x: Math.random() * canvas.width,
    y: canvas.height + Math.random() * 200,
    z: Math.random(),
    init() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 200;
    }
}));

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'screen';
    particles.forEach(p => {
        p.y -= (p.z * 0.8) + 0.2;
        if (p.y < -50) p.init();
        
        ctx.shadowBlur = (p.z * 5) + 2;
        ctx.shadowColor = '#00ff41';
        ctx.fillStyle = `rgba(0, 255, 65, ${p.z})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, (p.z * 3) + 0.5, 0, Math.PI * 2);
        ctx.fill();
    });
    requestAnimationFrame(animate);
}
animate();

// Логіка renderWord (додано класи для літер)
function renderWord(containerId, word) {
    const container = document.getElementById(containerId);
    const letters = word.split('').map(char => `<div class="letter">${char}</div>`).join('');
    container.innerHTML = `<div class="word-stack">${letters}</div>`;
}
// ... (loadData залишається незмінною)
</script>
</body>
</html>
