<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>ESTEvents — Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@900&display=swap" rel="stylesheet">
<style>
  body { 
    margin: 0; padding: 0; 
    background: linear-gradient(to bottom, #061a0f, #0c2d1b); 
    color: #fff; 
    font-family: "Poppins", sans-serif; 
    overflow: hidden;
    display: flex; justify-content: center; align-items: center;
    height: 100vh;
  }

  /* Ефект мерехтливих зірок (фон) */
  body::after {
    content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0;
    background-image: 
      radial-gradient(1.5px 1.5px at 10% 10%, #FFD700, transparent),
      radial-gradient(1px 1px at 30% 60%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 80% 20%, #FFD700, transparent),
      radial-gradient(2px 2px at 50% 90%, #fff, transparent);
    background-size: 400px 400px;
    animation: starTwinkle 4s infinite alternate;
  }
  @keyframes starTwinkle { 0% { opacity: 0.3; transform: scale(1); } 100% { opacity: 1; transform: scale(1.05); } }

  /* П-подібна структура (1008x840 px) */
  .p-screen {
    display: grid;
    grid-template-columns: 168px 672px 168px;
    grid-template-rows: 168px 672px;
    width: 1008px; height: 840px;
    position: relative; z-index: 1;
  }

  /* Рожева верхня панель */
  .top-zone { grid-column: 1 / 4; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }
  .top-zone img { height: 100px; }
  .top-zone .copyright { font-size: 16px; color: #f2b3cc; opacity: 0.8; }

  /* Зелені бічні панелі */
  .side-zone { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px 0; }
  .text-vertical {
    writing-mode: vertical-rl; transform: rotate(180deg);
    font-size: 45px; font-weight: 900; color: #eb8eb7;
    text-transform: uppercase; text-shadow: 0 0 15px rgba(235,142,183,0.7);
  }
  .side-zone img { width: 100px; }
</style>
</head>
<body>

<div class="p-screen">
  <div class="top-zone">
    <img src="Lemberg Cup.png" alt="Logo">
    <div class="copyright">© 2026 EstEvents by Емма Щелецька</div>
  </div>

  <div class="side-zone">
    <div class="text-vertical" id="name-field">ЗАВАНТАЖЕННЯ...</div>
    <img src="logo_estevents.png.png" alt="Logo">
  </div>

  <div class="center-zone"></div>

  <div class="side-zone">
    <div class="text-vertical" id="club-field"></div>
    <img src="logo_estevents.png.png" alt="Logo">
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyhuV7wnJIyk0oSdbLR1_np0DS47acXlRAnwTEV7MczrJlfn9GZvOMRTNYkjYciKdFu/exec";

async function loadData() {
  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    const data = await res.json();
    document.getElementById("name-field").innerText = data[0] || "";
    document.getElementById("club-field").innerText = data[1] || "";
  } catch (e) { console.error("Error:", e); }
}
setInterval(loadData, 3000);
loadData();
</script>

</body>
</html>
