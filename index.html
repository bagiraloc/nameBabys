<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>Lemberg Cup — P-Screen</title>
<style>
  body { margin: 0; background: #061a0f; color: #fff; font-family: "Poppins", sans-serif; overflow: hidden; }
  #particle-canvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
    background: radial-gradient(circle at center, #0a3d24 0%, #061a0f 100%);
  }
  
  /* Сетка: 84px + 1176px + 84px */
  .p-screen { 
    display: grid; 
    grid-template-columns: 84px 1176px 84px; 
    grid-template-rows: 168px 840px; 
    width: 1344px; 
    height: 1008px; 
    margin: 0 auto; 
    position: relative; 
    z-index: 1; 
  }
  
  .top-zone { 
    grid-column: 1 / 4; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    position: relative; 
  }
  
  /* Увеличенный размер шрифта для копирайта */
  .copyright { 
    position: absolute; 
    right: 40px; 
    top: 20px; 
    font-size: 24px; 
    color: #ffffff; 
    opacity: 0.8; 
    font-weight: 500;
  }
  
  .side-zone { display: flex; flex-direction: column; align-items: center; padding: 20px 0 30px 0; height: 840px; box-sizing: border-box; }
  .text-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; width: 168px; overflow: hidden; }
  .word-stack { display: flex; flex-direction: column; align-items: center; font-weight: 900; color: #eb8eb7; text-transform: uppercase; line-height: 1; width: 100%; justify-content: center; }
  
  .letter { 
    display: flex; justify-content: center; align-items: center;
    font-weight: 900; text-transform: uppercase;
    color: #eb8eb7;
    text-shadow: 0 0 10px #eb8eb7, 0 0 20px #ff007f;
  }
  
  .logo-text { font-size: 160px; white-space: nowrap; }
  .logo-side { width: 100px; flex-shrink: 0; margin-top: auto; }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="p-screen">
  <div class="top-zone">
    <div class="letter logo-text">LEMBERG CUP</div>
    <div class="copyright">© 2026 EstEvents by Емма Щелецька</div>
  </div>
  <div class="side-zone">
    <div class="text-wrapper" id="word1"></div>
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>
  <div class="center-zone"></div>
  <div class="side-zone">
    <div class="text-wrapper" id="word2"></div>
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>
</div>

<script>
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

class Particle {
    constructor() { this.init(); }
    init() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.5 + 0.5;
        this.baseOpacity = Math.random() * 0.7 + 0.1;
        this.flickerSpeed = Math.random() * 0.02 + 0.01;
        this.flickerOffset = Math.random() * Math.PI * 2;
    }
    draw() {
        const flicker = Math.sin(Date.now() * this.flickerSpeed + this.flickerOffset) * 0.5 + 0.5;
        ctx.fillStyle = `rgba(0, 255, 65, ${this.baseOpacity * flicker})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

const particles = Array.from({length: 800}, () => new Particle());

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'screen';
    particles.forEach(p => p.draw());
    requestAnimationFrame(animate);
}
animate();

const API_URL = "https://script.google.com/macros/s/AKfycbyhuV7wnJIyk0oSdbLR1_np0DS47acXlRAnwTEV7MczrJlfn9GZvOMRTNYkjYciKdFu/exec";

function renderWord(containerId, word) {
    const container = document.getElementById(containerId);
    if (!word) { container.innerHTML = ""; return; }
    
    const letters = word.split('').map(char => `<div class="letter">${char}</div>`).join('');
    container.innerHTML = `<div class="word-stack" id="stack-${containerId}">${letters}</div>`;
    
    const stack = document.getElementById(`stack-${containerId}`);
    const letterElements = stack.querySelectorAll('.letter');
    
    let size = 150;
    const maxHeight = container.offsetHeight;
    
    const applySize = (s) => {
        letterElements.forEach(l => l.style.fontSize = s + "px");
    };

    applySize(size);
    while (stack.offsetHeight > maxHeight && size > 20) {
        size -= 2;
        applySize(size);
    }
}

async function loadData() { 
    try { 
        const res = await fetch(API_URL + "?t=" + Date.now()); 
        const data = await res.json(); 
        const words = (data[0] || "").trim().split(/\s+/); 
        renderWord("word1", words[0] || ""); 
        renderWord("word2", words[1] || ""); 
    } catch (e) { console.error("Error:", e); } 
}
setInterval(loadData, 3000); loadData();
</script>
</body>
</html>
