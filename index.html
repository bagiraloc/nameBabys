<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>Lemberg Cup — P-Screen</title>
<style>
  body { margin: 0; background: #061a0f; color: #fff; font-family: "Poppins", sans-serif; overflow: hidden; }

  /* Фон з файлу */
  body::after {
    content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 0;
    background: url('green-glitter-particles-light-splatter-background_206636-757.avif') no-repeat center center;
    background-size: cover;
  }

  .p-screen {
    display: grid;
    grid-template-columns: 168px 672px 168px;
    grid-template-rows: 168px 672px;
    width: 1008px; height: 840px; margin: 0 auto; position: relative; z-index: 1;
  }

  /* РОЖЕВА ЗОНА: Логотип збільшено на 40% */
  .top-zone { 
    grid-column: 1 / 4; display: flex; align-items: center; justify-content: center; 
    position: relative; padding: 0;
  }
  .logo-top { 
    width: 100%; height: 100%; object-fit: contain;
    transform: scale(1.4); /* Збільшення на 40% */
  }
  .copyright { position: absolute; right: 20px; top: 10px; font-size: 12px; color: #ffffff; opacity: 0.6; }

  /* ЗЕЛЕНІ ЗОНИ: Повернуто фіксований великий розмір шрифту */
  .side-zone { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px 0; }
  .text-wrapper { display: flex; flex-direction: row; justify-content: center; width: 140px; gap: 10px; }
  .word-stack { display: flex; flex-direction: column; align-items: center; }
  .letter { 
    font-weight: 900; color: #eb8eb7; text-transform: uppercase;
    font-size: 45px; /* Повернуто початковий великий розмір */
    line-height: 1.1; 
  }
  .logo-side { width: 100px; margin-bottom: 20px; }
</style>
</head>
<body>

<div class="p-screen">
  <div class="top-zone">
    <img src="Lemberg Cup.png" class="logo-top" alt="Logo">
    <div class="copyright">© 2026 EstEvents by Емма Щелецька</div>
  </div>

  <div class="side-zone">
    <div class="text-wrapper" id="word1"></div>
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>

  <div class="center-zone"></div>

  <div class="side-zone">
    <div class="text-wrapper" id="word2"></div>
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyhuV7wnJIyk0oSdbLR1_np0DS47acXlRAnwTEV7MczrJlfn9GZvOMRTNYkjYciKdFu/exec";

function renderWord(containerId, word) {
    const container = document.getElementById(containerId);
    if (!word) { 
        container.innerHTML = `<div class="word-stack"><div class="letter">О</div><div class="letter">П</div><div class="letter">Л</div><div class="letter">Е</div><div class="letter">С</div><div class="letter">К</div><div class="letter">И</div></div>`;
        return; 
    }
    // Розбиваємо на букви без автоматичного зменшення шрифту
    const letters = word.split('').map(char => `<div class="letter">${char}</div>`).join('');
    container.innerHTML = `<div class="word-stack">${letters}</div>`;
}

async function loadData() {
  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    const data = await res.json();
    const words = (data[0] || "").split(' ');
    renderWord("word1", words[0] || "");
    renderWord("word2", words[1] || "");
  } catch (e) { 
    console.error("Error:", e); 
    renderWord("word1", ""); 
  }
}
setInterval(loadData, 3000);
loadData();
</script>
</body>
</html>
