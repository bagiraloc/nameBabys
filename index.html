<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>Lemberg Cup — P-Screen</title>
<style>
  body { margin: 0; background: #061a0f; color: #fff; font-family: "Poppins", sans-serif; overflow: hidden; }
  #particle-canvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
    background: radial-gradient(circle at center, #0a3d24 0%, #061a0f 100%);
  }
  
  .p-screen { 
    display: grid; 
    /* Колонки по краям теперь занимают всё пространство */
    grid-template-columns: 1fr 1176px 1fr; 
    grid-template-rows: 168px 840px; 
    width: 100vw; 
    height: 100vh;
    padding: 0;
    position: relative; 
    z-index: 1; 
  }
  
  .top-zone { grid-column: 1 / 4; display: flex; align-items: center; justify-content: center; }
  
  /* Боковые зоны с отступом 5см (175px) */
  .side-zone { 
    display: flex; flex-direction: column; height: 840px; 
    padding: 20px 175px 30px 175px; /* Отступ 5см по бокам */
    box-sizing: border-box;
  }
  
  /* Выравнивание текста в колонках */
  #side-left { align-items: flex-start; text-align: left; }
  #side-right { align-items: flex-end; text-align: right; }
  
  .copyright-side { 
    font-size: 16px; color: #ffffff; opacity: 0.7; font-weight: 500;
    text-align: right; margin-top: 10px; width: 100%;
  }
  
  .text-wrapper { flex: 1; display: flex; align-items: center; width: 100%; overflow: hidden; }
  .word-stack { display: flex; flex-direction: column; font-weight: 900; color: #eb8eb7; text-transform: uppercase; line-height: 1; width: 100%; }
  
  .letter { 
    display: flex; align-items: center; font-weight: 900; text-transform: uppercase;
    color: #eb8eb7; text-shadow: 0 0 10px #eb8eb7, 0 0 20px #ff007f;
  }
  
  .logo-text { font-size: 160px; white-space: nowrap; }
  .logo-side { width: 100px; flex-shrink: 0; margin-top: auto; }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="p-screen">
  <div class="top-zone">
    <div class="letter logo-text">LEMBERG CUP</div>
  </div>
  
  <div class="side-zone" id="side-left">
    <div class="text-wrapper" id="word1"></div>
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>
  
  <div class="center-zone"></div>
  
  <div class="side-zone" id="side-right">
    <div class="text-wrapper" id="word2"></div>
    <div class="copyright-side">© 2026 EstEvents by Емма Щелецька</div>
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>
</div>

<script>
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// ... (Particle logic remains same) ...
const particles = Array.from({length: 800}, () => ({
    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
    size: Math.random() * 2.5 + 0.5, baseOpacity: Math.random() * 0.7 + 0.1,
    flickerSpeed: Math.random() * 0.02 + 0.01, flickerOffset: Math.random() * Math.PI * 2
}));

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'screen';
    particles.forEach(p => {
        const flicker = Math.sin(Date.now() * p.flickerSpeed + p.flickerOffset) * 0.5 + 0.5;
        ctx.fillStyle = `rgba(0, 255, 65, ${p.baseOpacity * flicker})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    });
    requestAnimationFrame(animate);
}
animate();

const API_URL = "https://script.google.com/macros/s/AKfycbyhuV7wnJIyk0oSdbLR1_np0DS47acXlRAnwTEV7MczrJlfn9GZvOMRTNYkjYciKdFu/exec";

function renderWord(containerId, word, align) {
    const container = document.getElementById(containerId);
    if (!word) { container.innerHTML = ""; return; }
    const letters = word.split('').map(char => `<div class="letter" style="justify-content: ${align}">${char}</div>`).join('');
    container.innerHTML = `<div class="word-stack" style="align-items: ${align === 'flex-start' ? 'flex-start' : 'flex-end'}">${letters}</div>`;
}

async function loadData() { 
    try { 
        const res = await fetch(API_URL + "?t=" + Date.now()); 
        const data = await res.json(); 
        const words = (data[0] || "").trim().split(/\s+/); 
        renderWord("word1", words[0] || "", "flex-start"); 
        renderWord("word2", words[1] || "", "flex-end"); 
    } catch (e) { console.error(e); } 
}
setInterval(loadData, 3000); loadData();
</script>
</body>
</html>
