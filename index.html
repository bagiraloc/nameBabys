<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ETNIKA CUP — Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@900&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  padding: 0;
  font-family: "Poppins", sans-serif;
  background: linear-gradient(to bottom, #061a0f, #0c2d1b);
  color: #ffffff;
  display: flex;
  flex-direction: column;
  justify-content: center; 
  align-items: center;
  height: 100vh;
  text-align: center;
  overflow: hidden;
  position: relative;
}

/* Блискітки: більші та мерехтливі */
body::after {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 1;
  pointer-events: none;
  background-image:
    radial-gradient(4px 4px at 20px 30px, #fff, transparent),
    radial-gradient(6px 6px at 100px 150px, #ADFF2F, transparent),
    radial-gradient(5px 5px at 250px 80px, #FFD700, transparent),
    radial-gradient(7px 7px at 400px 300px, #32CD32, transparent),
    radial-gradient(5px 5px at 150px 450px, #fff, transparent);
  background-size: 500px 500px;
  animation: glitterFall 12s linear infinite, twinkle 1.5s ease-in-out infinite alternate;
  opacity: 0.8;
}

@keyframes glitterFall {
  0% { background-position: 0 0; }
  100% { background-position: 100px 500px; }
}

@keyframes twinkle {
  0% { opacity: 0.3; }
  100% { opacity: 1; }
}

header {
  margin-bottom: 20px;
  z-index: 10;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.logo-etnika-cup-img {
  max-width: 95%;
  width: 850px; 
  height: auto;
  filter: drop-shadow(0 0 15px rgba(235, 142, 183, 0.5));
}

.scoreboard {
  background: rgba(255, 255, 255, 0.07);
  border: 5px solid #000000; 
  border-radius: 40px;
  padding: 40px 40px; 
  box-shadow: 0 0 80px rgba(235, 142, 183, 0.3);
  backdrop-filter: blur(20px);
  min-width: 85%; 
  margin-top: 10px;
  margin-bottom: 50px;
  display: flex;
  flex-direction: column;
  justify-content: center; 
  transition: filter 0.5s ease-in-out, opacity 0.5s ease-in-out;
  z-index: 10;
  position: relative;
}

.cell-container {
  display: flex;
  flex-direction: column;
  gap: 10px; 
}

.cell {
  color: #eb8eb7; 
  font-weight: 900; 
  line-height: 1.1;
  text-shadow: 0 0 20px rgba(235, 142, 183, 0.8);
}

.name-row { font-size: 7.5em; text-transform: uppercase; letter-spacing: 4px; }
.club-row { font-size: 4.8em; opacity: 0.95; color: #eb8eb7; }

.logo-estevents {
  position: absolute;
  top: 30px;
  right: 40px;
  width: 180px;
  height: auto;
  z-index: 20;
  filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
}

footer {
  position: absolute;
  bottom: 25px;
  color: #f2b3cc;
  font-size: 1.1em; 
  font-weight: 600;
  opacity: 0.7;
  z-index: 10;
}

@media (max-width: 768px) {
  .logo-etnika-cup-img { width: 320px; }
  .name-row { font-size: 2.2em; }
  .club-row { font-size: 1.4em; }
  .scoreboard { margin-top: 15px; margin-bottom: 30px; padding: 25px 15px; }
  .logo-estevents { width: 100px; top: 15px; right: 15px; }
  footer { bottom: 10px; font-size: 0.8em; }
}
</style>
</head>
<body>

<img src="logo_estevents.png.png" alt="EstEvents Logo" class="logo-estevents">

<header>
  <img src="Lemberg Cup.png" alt="ETNIKA CUP Logo" class="logo-etnika-cup-img">
</header>

<div class="scoreboard" id="scoreboard">
  <div id="content" class="cell-container">
    <div class="cell">ЗАВАНТАЖЕННЯ...</div>
  </div>
</div>

<footer>© 2026 EstEvents by Емма Щелецька</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyhuV7wnJIyk0oSdbLR1_np0DS47acXlRAnwTEV7MczrJlfn9GZvOMRTNYkjYciKdFu/exec";
let lastData = "";

async function loadData() {
  const scoreboard = document.getElementById("scoreboard");
  const content = document.getElementById("content");
  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    if (!res.ok) return;
    const data = await res.json();
    if (!Array.isArray(data)) return;
    const name = String(data[0] || "").trim();
    const club = String(data[1] || "").trim();
    const currentFullString = name + club;
    if (currentFullString === lastData) return;
    lastData = currentFullString;
    scoreboard.style.filter = "blur(10px)";
    scoreboard.style.opacity = "0.7";
    setTimeout(() => {
      content.innerHTML = `<div class="cell name-row">${name || "—"}</div><div class="cell club-row">${club || "—"}</div>`;
      scoreboard.style.filter = "blur(0)";
      scoreboard.style.opacity = "1";
    }, 400);
  } catch (e) { console.error("Error fetching data:", e); }
}
loadData();
setInterval(loadData, 3000); 
</script>

</body>
</html>
