<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sportart Rhythmic — NAME & CLUB</title>
<style>
body {
  margin: 0;
  padding: 0;
  font-family: "Poppins", sans-serif;
  background: radial-gradient(circle at top, #1a082b 0%, #0c0215 100%);
  color: #ffffff;
  display: flex;
  flex-direction: column;
  justify-content: center; 
  align-items: center;
  height: 100vh;
  text-align: center;
  overflow: hidden;
}

header {
  position: absolute;
  top: 40px;
  animation: fadeIn 1.5s ease-in-out;
}

.header-logo {
  width: 450px; 
  height: auto;
  filter: drop-shadow(0 0 15px rgba(194, 153, 255, 0.4));
}

.logo-estevents {
  position: fixed;
  bottom: 25px;
  right: 25px;
  width: 130px;
  height: auto;
  z-index: 1000;
  opacity: 0.8;
}

.scoreboard {
  background: rgba(255, 255, 255, 0.05);
  border: 4px solid rgba(200, 150, 255, 0.5); 
  border-radius: 40px;
  padding: 60px 40px; 
  box-shadow: 0 0 60px rgba(160, 80, 255, 0.2);
  backdrop-filter: blur(15px);
  min-width: 85%; 
  display: flex;
  flex-direction: column;
  justify-content: center; 
  transition: filter 0.5s ease-in-out;
}

.cell-container {
  display: flex;
  flex-direction: column;
  gap: 30px; 
}

.cell {
  color: #ffffff; /* Увесь текст тепер білий */
  font-weight: 900; 
  line-height: 1.2;
  text-shadow: 4px 4px 20px rgba(0, 0, 0, 0.6);
  animation: fadeUp 0.6s ease-out forwards;
}

/* Стиль для ІМЕНІ */
.name-row {
  font-size: 7em; 
  text-transform: uppercase;
  letter-spacing: 3px;
}

/* Стиль для КЛУБУ — тепер також білий */
.club-row {
  font-size: 4.5em; 
  color: #ffffff; 
  opacity: 0.95; /* Легка прозорість для візуального розділення, але колір білий */
}

footer {
  position: absolute;
  bottom: 20px;
  color: #bdaaff;
  font-size: 1.2em; 
  font-weight: 600;
  opacity: 0.7;
}

@keyframes fadeUp {
  0% { transform: translateY(30px); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 768px) {
  .header-logo { width: 220px; }
  .name-row { font-size: 2.8em; }
  .club-row { font-size: 1.8em; }
  .scoreboard { padding: 30px; }
}
</style>
</head>
<body>

<header>
  <img src="logo_sportart.png.jpg" alt="Sport Art Cup" class="header-logo">
</header>

<img src="logo_estevents.png.png" alt="EstEvents Logo" class="logo-estevents">

<div class="scoreboard" id="scoreboard">
  <div id="content" class="cell-container">
    <div class="cell">ЗАВАНТАЖЕННЯ...</div>
  </div>
</div>

<footer>© 2026 EstEvents by Емма Щелецька</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyhuV7wnJIyk0oSdbLR1_np0DS47acXlRAnwTEV7MczrJlfn9GZvOMRTNYkjYciKdFu/exec";
let lastData = "";

async function loadData() {
  const scoreboard = document.getElementById("scoreboard");
  const content = document.getElementById("content");

  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    if (!res.ok) return;

    const data = await res.json();
    if (!Array.isArray(data)) return;

    // Беремо тільки B3 (data[0]) та C3 (data[1])
    const name = String(data[0] || "").trim();
    const club = String(data[1] || "").trim();

    const newData = name + club;
    if (newData === lastData) return;
    lastData = newData;

    scoreboard.style.filter = "blur(10px)";

    setTimeout(() => {
      content.innerHTML = `
        <div class="cell name-row">${name || "—"}</div>
        <div class="cell club-row">${club || "—"}</div>
      `;
      scoreboard.style.filter = "blur(0)";
    }, 400);

  } catch (e) { console.error("Error", e); }
}

loadData();
setInterval(loadData, 3000);
</script>

</body>
</html>
