<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>Lemberg Cup — P-Screen</title>
<style>
  body { margin: 0; background: #061a0f; color: #fff; font-family: "Poppins", sans-serif; overflow: hidden; }
  
  #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

  /* СТИЛЬ БУКВ: СВІТОВИЙ ОБ'ЄКТ */
  .letter {
    display: flex; justify-content: center; align-items: center;
    width: 100%; font-size: 45px; font-weight: 900;
    text-transform: uppercase;
    color: transparent;
    
    /* Блік (Light Sweep) */
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
    background-size: 200% 100%;
    background-clip: text;
    -webkit-background-clip: text;
    
    /* Анімації */
    animation: pulseGlow 2s infinite alternate, sweepLight 4s infinite linear;
    text-shadow: 0 0 10px #ffb7d9, 0 0 20px #ff007f;
  }

  @keyframes pulseGlow {
    0% { text-shadow: 0 0 10px #ffb7d9, 0 0 20px #ff007f; }
    100% { text-shadow: 0 0 20px #ffb7d9, 0 0 40px #ff007f, 0 0 60px #ff007f; }
  }

  @keyframes sweepLight {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Розмітка екрану */
  .p-screen { display: grid; grid-template-columns: 168px 672px 168px; grid-template-rows: 168px 672px; width: 1008px; height: 840px; margin: 0 auto; position: relative; z-index: 1; }
  .top-zone { grid-column: 1 / 4; display: flex; align-items: center; justify-content: center; position: relative; }
  .logo-top { width: 100%; height: 100%; object-fit: contain; transform: scale(1.4); }
  .copyright { position: absolute; right: 20px; top: 10px; font-size: 12px; color: #ffffff; opacity: 0.6; }
  .side-zone { display: flex; flex-direction: column; align-items: center; padding: 20px 0 30px 0; height: 672px; box-sizing: border-box; }
  .text-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; width: 168px; overflow: hidden; }
  .word-stack { display: flex; flex-direction: column; align-items: center; width: 100%; }
  .logo-side { width: 100px; flex-shrink: 0; margin-top: auto; }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="p-screen">
  <div class="top-zone">
    <img src="Lemberg Cup.png" class="logo-top" alt="Logo">
    <div class="copyright">© 2026 EstEvents by Емма Щелецька</div>
  </div>
  <div class="side-zone">
    <div class="text-wrapper" id="word1"></div>
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>
  <div class="center-zone"></div>
  <div class="side-zone">
    <div class="text-wrapper" id="word2"></div>
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>
</div>

<script>
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d', { alpha: false });
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// 400 частиц — оптимально для плотного свечения без лагов
const particles = Array.from({length: 400}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    z: Math.random(),
    speed: Math.random() * 0.5 + 0.2
}));

function animate() {
    ctx.fillStyle = '#061a0f'; // Фон
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'screen';
    
    particles.forEach(p => {
        p.y -= p.speed;
        if (p.y < 0) p.y = canvas.height;
        
        ctx.fillStyle = `rgba(0, 255, 65, ${p.z})`;
        ctx.shadowBlur = p.z * 10;
        ctx.shadowColor = '#00ff41';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.z * 3, 0, Math.PI * 2);
        ctx.fill();
    });
    requestAnimationFrame(animate);
}
animate();

// Обновление слов
const API_URL = "https://script.google.com/macros/s/AKfycbyhuV7wnJIyk0oSdbLR1_np0DS47acXlRAnwTEV7MczrJlfn9GZvOMRTNYkjYciKdFu/exec";
function renderWord(id, word) {
    const cont = document.getElementById(id);
    cont.innerHTML = `<div class="word-stack">${word.split('').map(c => `<div class="letter">${c}</div>`).join('')}</div>`;
}

async function loadData() {
  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    const data = await res.json();
    const words = (data[0] || "").trim().split(/\s+/);
    renderWord("word1", words[0] || "");
    renderWord("word2", words[1] || "");
  } catch (e) { console.error("Error:", e); }
}
setInterval(loadData, 3000);
loadData();
</script>
</body>
</html>
