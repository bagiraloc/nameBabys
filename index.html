<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>Чорні Вівці — P-Screen</title>
<style>
  :root { --side-width: 274px; }
  body { margin: 0; background: #2b0000; color: #000; font-family: "Poppins", sans-serif; overflow: hidden; }
  #particle-canvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
    background: radial-gradient(circle at center, #8b0000 0%, #2b0000 100%);
  }
  
  .p-screen { 
    display: grid; 
    grid-template-columns: var(--side-width) 1176px var(--side-width); 
    grid-template-rows: 168px 840px; 
    width: calc(var(--side-width) * 2 + 1176px); 
    height: 1008px; 
    margin: 0 auto; 
    position: relative; 
    z-index: 1; 
  }
  
  .top-zone { 
    grid-column: 1 / 4; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
  }
  
  /* Панель управления ровно по центру */
  .control-panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.85);
    padding: 15px 25px;
    border-radius: 10px;
    display: flex;
    gap: 15px;
    z-index: 10;
    align-items: center;
    border: 1px solid #000;
    color: #fff;
  }
  .control-btn {
    padding: 10px 20px;
    cursor: pointer;
    background: #000000;
    color: #ffffff;
    border: 1px solid #ff4d4d;
    font-weight: bold;
    border-radius: 5px;
  }

  .copyright-side { 
    font-size: 16px; 
    color: #000000; 
    font-weight: 700;
    text-align: center;
    margin-top: 10px;
    width: 100%;
    word-wrap: break-word;
    text-shadow: 0 0 5px rgba(255, 255, 255, 0.4);
  }
  
  .center-zone { position: relative; width: 100%; height: 100%; }
  
  .side-zone { display: flex; flex-direction: column; align-items: center; padding: 20px 0 30px 0; height: 840px; box-sizing: border-box; }
  .text-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; width: var(--side-width); overflow: hidden; }
  
  /* Горизонтальное расположение букв */
  .word-stack { 
    display: flex; 
    flex-direction: row; 
    align-items: center; 
    justify-content: center;
    font-weight: 900; 
    color: #000000; 
    text-transform: uppercase; 
    line-height: 1; 
    width: 100%; 
  }
  
  .letter { 
    display: flex; justify-content: center; align-items: center;
    font-weight: 900; text-transform: uppercase;
    color: #000000;
    text-shadow: 0 0 8px rgba(255, 0, 0, 0.6), 0 0 15px rgba(0, 0, 0, 0.8);
  }
  
  .logo-text { font-size: 130px; white-space: nowrap; }
  .logo-side { width: 100px; flex-shrink: 0; margin-top: auto; }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<!-- Меню по центру экрана -->
<div class="control-panel">
    <button class="control-btn" onclick="updateWidth(-20)">Зменшити</button>
    <span style="font-weight: bold;">Колонки</span>
    <button class="control-btn" onclick="updateWidth(20)">Збільшити</button>
</div>

<div class="p-screen">
  <div class="top-zone">
    <div class="letter logo-text">ЧОРНІ ВІВЦІ</div>
  </div>
  
  <div class="side-zone">
    <div class="text-wrapper" id="word1"></div>
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>
  
  <div class="center-zone"></div>
  
  <div class="side-zone">
    <div class="text-wrapper" id="word2"></div>
    <div class="copyright-side">© 2026 EstEvents by Емма Щелецька</div>
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>
</div>

<script>
let sideWidth = 274;
function updateWidth(delta) {
    sideWidth += delta;
    document.documentElement.style.setProperty('--side-width', sideWidth + 'px');
}

const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

class Particle {
    constructor() { this.init(); }
    init() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.5 + 0.5;
        this.baseOpacity = Math.random() * 0.7 + 0.1;
        this.flickerSpeed = Math.random() * 0.02 + 0.01;
        this.flickerOffset = Math.random() * Math.PI * 2;
    }
    draw() {
        const flicker = Math.sin(Date.now() * this.flickerSpeed + this.flickerOffset) * 0.5 + 0.5;
        ctx.fillStyle = `rgba(0, 0, 0, ${this.baseOpacity * flicker})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

const particles = Array.from({length: 800}, () => new Particle());

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'source-over';
    particles.forEach(p => p.draw());
    requestAnimationFrame(animate);
}
animate();

const API_URL = "https://script.google.com/macros/s/AKfycbyhuV7wnJIyk0oSdbLR1_np0DS47acXlRAnwTEV7MczrJlfn9GZvOMRTNYkjYciKdFu/exec";

function renderWord(containerId, word) {
    const container = document.getElementById(containerId);
    if (!word) { container.innerHTML = ""; return; }
    
    const letters = word.split('').map(char => `<div class="letter">${char}</div>`).join('');
    container.innerHTML = `<div class="word-stack" id="stack-${containerId}">${letters}</div>`;
    
    const stack = document.getElementById(`stack-${containerId}`);
    const letterElements = stack.querySelectorAll('.letter');
    
    let size = 60;
    const maxWidth = container.offsetWidth;
    
    const applySize = (s) => {
        letterElements.forEach(l => l.style.fontSize = s + "px");
    };

    applySize(size);
    while (stack.offsetWidth > maxWidth && size > 12) {
        size -= 2;
        applySize(size);
    }
}

async function loadData() { 
    try { 
        const res = await fetch(API_URL + "?t=" + Date.now()); 
        const data = await res.json(); 
        const words = (data[0] || "").trim().split(/\s+/); 
        
        // Левый блок — Фамилия, Правый — Имя
        renderWord("word1", words[0] || "Прізвище"); 
        renderWord("word2", words[1] || "Ім'я"); 
    } catch (e) { 
        console.error("Error:", e); 
        renderWord("word1", "Прізвище"); 
        renderWord("word2", "Ім'я"); 
    } 
}
setInterval(loadData, 3000); loadData();
</script>
</body>
</html>
