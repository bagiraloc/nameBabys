<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>Lemberg Cup — P-Screen</title>
<style>
  body { 
    margin: 0; background: #061a0f; color: #fff; 
    font-family: "Poppins", sans-serif; overflow: hidden; 
  }

  /* Заміна червоного на зелений за допомогою фільтра */
  #bg-video {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: -1;
    filter: hue-rotate(110deg) saturate(1.5) brightness(0.8);
  }

  .p-screen {
    display: grid;
    grid-template-columns: 168px 672px 168px;
    grid-template-rows: 168px 672px;
    width: 1008px; height: 840px; margin: 0 auto; position: relative; z-index: 1;
  }

  .top-zone { 
    grid-column: 1 / 4; display: flex; align-items: center; justify-content: center; 
    position: relative; padding: 0;
  }
  .logo-top { width: 100%; height: 100%; object-fit: contain; transform: scale(1.4); }
  .copyright { position: absolute; right: 20px; top: 10px; font-size: 12px; color: #ffffff; opacity: 0.6; }

  .side-zone { 
    display: flex; flex-direction: column; align-items: center; 
    padding: 20px 0 30px 0; height: 672px; box-sizing: border-box;
  }
  
  .text-wrapper {
    flex: 1; display: flex; align-items: center; justify-content: center;
    width: 168px; overflow: hidden;
  }
  
  .word-stack { 
    display: flex; flex-direction: column; align-items: center; 
    font-weight: 900; color: #eb8eb7; text-transform: uppercase; 
    line-height: 1.1; width: 100%;
  }

  .letter { 
    display: flex; justify-content: center; align-items: center;
    width: 100%; font-size: 45px;
  }
  
  .logo-side { width: 100px; flex-shrink: 0; margin-top: auto; }
</style>
</head>
<body>

<video id="bg-video" autoplay loop muted playsinline>
  <source src="depositphotos_273992770-stock-video-red-glitter-sparkles-animation-black.mp4" type="video/mp4">
</video>

<div class="p-screen">
  <div class="top-zone">
    <img src="Lemberg Cup.png" class="logo-top" alt="Logo">
    <div class="copyright">© 2026 EstEvents by Емма Щелецька</div>
  </div>

  <div class="side-zone">
    <div class="text-wrapper" id="word1"></div>
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>

  <div class="center-zone"></div>

  <div class="side-zone">
    <div class="text-wrapper" id="word2"></div>
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyhuV7wnJIyk0oSdbLR1_np0DS47acXlRAnwTEV7MczrJlfn9GZvOMRTNYkjYciKdFu/exec";

function renderWord(containerId, word) {
    const container = document.getElementById(containerId);
    if (!word) { 
        container.innerHTML = `<div class="word-stack"><div class="letter">О</div><div class="letter">П</div><div class="letter">Л</div><div class="letter">Е</div><div class="letter">С</div><div class="letter">К</div><div class="letter">И</div></div>`;
        return; 
    }
    const letters = word.split('').map(char => `<div class="letter">${char}</div>`).join('');
    container.innerHTML = `<div class="word-stack" id="stack-${containerId}">${letters}</div>`;
    
    const stack = document.getElementById(`stack-${containerId}`);
    const wrapper = container;
    
    let size = 45;
    stack.querySelectorAll('.letter').forEach(l => l.style.fontSize = size + "px");
    
    while (stack.offsetHeight > (wrapper.offsetHeight - 20) && size > 15) {
        size -= 2;
        stack.querySelectorAll('.letter').forEach(l => l.style.fontSize = size + "px");
    }
    while (stack.offsetHeight < (wrapper.offsetHeight * 0.7) && size < 120) {
        size += 2;
        stack.querySelectorAll('.letter').forEach(l => l.style.fontSize = size + "px");
    }
}

async function loadData() {
  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    const data = await res.json();
    const rawText = (data[0] || "").trim();
    const words = rawText.split(/\s+/);
    renderWord("word1", words[0] || "");
    renderWord("word2", words[1] || "");
  } catch (e) { console.error("Error:", e); }
}
setInterval(loadData, 3000);
loadData();
</script>
</body>
</html>
