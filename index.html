<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>Lemberg Cup — P-Screen</title>
<style>
  body { margin: 0; background: #061a0f; color: #fff; font-family: "Poppins", sans-serif; overflow: hidden; }

  /* Фон */
  body::after {
    content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 0;
    background-image: radial-gradient(1.5px 1.5px at 10% 10%, #FFD700, transparent), radial-gradient(1px 1px at 30% 60%, #fff, transparent);
    background-size: 400px 400px; animation: starTwinkle 4s infinite alternate;
  }
  @keyframes starTwinkle { 0% { opacity: 0.3; } 100% { opacity: 1; } }

  .p-screen {
    display: grid;
    grid-template-columns: 168px 672px 168px;
    grid-template-rows: 168px 672px;
    width: 1008px; height: 840px; margin: 0 auto; position: relative; z-index: 1;
  }

  /* РОЖЕВА ЗОНА */
  .top-zone { grid-column: 1 / 4; display: flex; align-items: center; justify-content: center; position: relative; }
  .logo-top { width: 95%; max-height: 140px; object-fit: contain; }
  .copyright { position: absolute; right: 20px; top: 10px; font-size: 12px; color: #ffffff; opacity: 0.6; }

  /* ЗЕЛЕНІ ЗОНИ */
  .side-zone { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px 0; }
  
  /* Контейнер слова: адаптується під висоту 672px */
  .word-container {
    flex-grow: 1; display: flex; align-items: center; justify-content: center;
    width: 100%; overflow: hidden;
  }
  .word-stack { 
    display: flex; flex-direction: column; align-items: center; font-weight: 900; 
    color: #eb8eb7; text-transform: uppercase; line-height: 0.9;
  }
  .letter { font-size: 60px; } /* Базовий розмір, буде змінено скриптом */
  
  .logo-side { width: 100px; margin-bottom: 20px; }
</style>
</head>
<body>

<div class="p-screen">
  <div class="top-zone">
    <img src="Lemberg Cup.png" class="logo-top" alt="Logo">
    <div class="copyright">© 2026 EstEvents by Емма Щелецька</div>
  </div>

  <div class="side-zone">
    <div class="word-container" id="word1"></div>
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>

  <div class="center-zone"></div>

  <div class="side-zone">
    <div class="word-container" id="word2"></div>
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyhuV7wnJIyk0oSdbLR1_np0DS47acXlRAnwTEV7MczrJlfn9GZvOMRTNYkjYciKdFu/exec";

function renderWord(containerId, word) {
    const container = document.getElementById(containerId);
    if (!word) { container.innerHTML = ""; return; }
    
    // Створюємо вертикальний стовпчик
    const letters = word.split('').map(char => `<div class="letter">${char}</div>`).join('');
    container.innerHTML = `<div class="word-stack" id="stack-${containerId}">${letters}</div>`;
    
    // Адаптація розміру під висоту 600px (залишаючи місце для лого)
    const stack = document.getElementById(`stack-${containerId}`);
    let fontSize = 60; 
    stack.style.fontSize = fontSize + "px";
    
    // Якщо слово занадто довге, зменшуємо шрифт
    while (stack.offsetHeight > 550 && fontSize > 20) {
        fontSize -= 2;
        stack.style.fontSize = fontSize + "px";
    }
}

async function loadData() {
  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    const data = await res.json();
    const words = (data[0] || "").split(' ');
    renderWord("word1", words[0] || "");
    renderWord("word2", words[1] || "");
  } catch (e) { console.error("Error:", e); }
}
setInterval(loadData, 3000);
loadData();
</script>
</body>
</html>
