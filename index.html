<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>Чорні Вівці — P-Screen</title>
<style>
  :root { --side-width: 274px; }
  body { margin: 0; background: #2b0000; color: #000; font-family: "Poppins", sans-serif; overflow: hidden; }
  #particle-canvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
    background: radial-gradient(circle at center, #8b0000 0%, #2b0000 100%);
  }
  
  /* Разметка экрана с центральным блоком во всю высоту */
  .p-screen { 
    display: grid; 
    grid-template-columns: var(--side-width) 1176px var(--side-width); 
    grid-template-rows: 1008px; 
    width: calc(var(--side-width) * 2 + 1176px); 
    height: 1008px; 
    margin: 0 auto; 
    position: relative; 
    z-index: 1; 
  }
  
  .side-zone { 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: flex-end; 
    padding: 30px 0; 
    height: 1008px; 
    box-sizing: border-box; 
  }

  /* Центральная зона с выравниванием элементов строго по вертикали по центру */
  .center-zone { 
    position: relative; 
    width: 100%; 
    height: 100%; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    gap: 30px; 
  }
  
  .letter { 
    display: flex; 
    justify-content: center; 
    align-items: center;
    font-weight: 900; 
    text-transform: uppercase;
    color: #000000;
    text-shadow: 0 0 8px rgba(255, 0, 0, 0.6), 0 0 15px rgba(0, 0, 0, 0.8);
    text-align: center;
    line-height: 1;
  }
  
  /* Стиль для заголовка Чорні Вівці */
  .logo-text { 
    font-size: 110px; 
    white-space: nowrap; 
  }

  /* Стиль для Фамилии и Имени */
  .person-text { 
    font-size: 80px; 
    white-space: nowrap; 
  }

  .copyright-side { 
    font-size: 16px; 
    color: #000000; 
    font-weight: 700;
    text-align: center;
    margin-top: 10px;
    width: 100%;
    word-wrap: break-word;
    text-shadow: 0 0 5px rgba(255, 255, 255, 0.4);
  }
  
  .logo-side { width: 100px; flex-shrink: 0; }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="p-screen">
  <!-- Левая колонка (логотип) -->
  <div class="side-zone">
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>
  
  <!-- Центральная зона: Заголовок -> Фамилия -> Имя -->
  <div class="center-zone">
    <div class="letter logo-text">ЧОРНІ ВІВЦІ</div>
    <div class="letter person-text" id="word1">Прізвище</div>
    <div class="letter person-text" id="word2">Ім'я</div>
  </div>
  
  <!-- Правая колонка (копирайт и логотип) -->
  <div class="side-zone">
    <div class="copyright-side">© 2026 EstEvents by Емма Щелецька</div>
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>
</div>

<script>
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

class Particle {
    constructor() { this.init(); }
    init() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.5 + 0.5;
        this.baseOpacity = Math.random() * 0.7 + 0.1;
        this.flickerSpeed = Math.random() * 0.02 + 0.01;
        this.flickerOffset = Math.random() * Math.PI * 2;
    }
    draw() {
        const flicker = Math.sin(Date.now() * this.flickerSpeed + this.flickerOffset) * 0.5 + 0.5;
        ctx.fillStyle = `rgba(0, 0, 0, ${this.baseOpacity * flicker})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

const particles = Array.from({length: 800}, () => new Particle());

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'source-over';
    particles.forEach(p => p.draw());
    requestAnimationFrame(animate);
}
animate();

const API_URL = "https://script.google.com/macros/s/AKfycbyhuV7wnJIyk0oSdbLR1_np0DS47acXlRAnwTEV7MczrJlfn9GZvOMRTNYkjYciKdFu/exec";

async function loadData() { 
    try { 
        const res = await fetch(API_URL + "?t=" + Date.now()); 
        const data = await res.json(); 
        const words = (data[0] || "").trim().split(/\s+/); 
        
        document.getElementById("word1").textContent = words[0] || "Прізвище"; 
        document.getElementById("word2").textContent = words[1] || "Ім'я"; 
    } catch (e) { 
        console.error("Error:", e); 
        document.getElementById("word1").textContent = "Прізвище"; 
        document.getElementById("word2").textContent = "Ім'я"; 
    } 
}
setInterval(loadData, 3000); loadData();
</script>
</body>
</html>
