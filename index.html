<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>Lemberg Cup — P-Screen</title>
<style>
  body { margin: 0; background: #061a0f; color: #fff; font-family: "Poppins", sans-serif; overflow: hidden; }
  #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #0a3d24 0%, #061a0f 100%); }
  
  .p-screen { 
    display: grid; 
    grid-template-columns: 1fr 1176px 1fr; 
    grid-template-rows: 168px 840px; 
    width: 100vw; height: 100vh;
    position: relative; z-index: 1; 
  }
  
  .top-zone { grid-column: 1 / 4; display: flex; align-items: center; justify-content: center; }
  
  /* Боковые зоны */
  .side-zone { 
    display: flex; flex-direction: column; height: 840px; 
    padding: 20px 175px 30px 175px; 
    box-sizing: border-box;
  }
  
  #side-left { align-items: flex-start; }
  #side-right { align-items: flex-end; }
  
  .copyright-side { font-size: 16px; color: #ffffff; opacity: 0.7; font-weight: 500; text-align: right; margin-top: 10px; width: 100%; }
  
  .text-wrapper { flex: 1; display: flex; align-items: center; width: 100%; overflow: hidden; }
  .word-stack { display: flex; flex-direction: column; font-weight: 900; color: #eb8eb7; text-transform: uppercase; line-height: 1; width: 100%; }
  .letter { display: flex; align-items: center; font-weight: 900; text-transform: uppercase; color: #eb8eb7; text-shadow: 0 0 10px #eb8eb7, 0 0 20px #ff007f; }
  .logo-side { width: 100px; flex-shrink: 0; margin-top: auto; }

  /* Панель управления */
  .controls {
    position: fixed; bottom: 20px; left: 20px; z-index: 100;
    background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; border: 1px solid #444;
  }
  .controls button { cursor: pointer; padding: 5px 10px; margin: 2px; }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="controls">
  <div style="margin-bottom:5px">Левая: <button onclick="changePad('side-left', -10)">←</button><button onclick="changePad('side-left', 10)">→</button></div>
  <div>Правая: <button onclick="changePad('side-right', -10)">←</button><button onclick="changePad('side-right', 10)">→</button></div>
</div>

<div class="p-screen">
  <div class="top-zone"><div class="letter" style="font-size: 160px">LEMBERG CUP</div></div>
  <div class="side-zone" id="side-left">
    <div class="text-wrapper" id="word1"></div>
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>
  <div class="center-zone"></div>
  <div class="side-zone" id="side-right">
    <div class="text-wrapper" id="word2"></div>
    <div class="copyright-side">© 2026 EstEvents by Емма Щелецька</div>
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>
</div>

<script>
// Функция изменения отступов
function changePad(id, delta) {
  const el = document.getElementById(id);
  let currentPad = parseInt(window.getComputedStyle(el).paddingRight);
  el.style.paddingLeft = (currentPad + delta) + "px";
  el.style.paddingRight = (currentPad + delta) + "px";
}

// Particle & Data logic
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    requestAnimationFrame(animate);
}
animate();

const API_URL = "https://script.google.com/macros/s/AKfycbyhuV7wnJIyk0oSdbLR1_np0DS47acXlRAnwTEV7MczrJlfn9GZvOMRTNYkjYciKdFu/exec";

function renderWord(containerId, word, align) {
    const container = document.getElementById(containerId);
    if (!word) return;
    container.innerHTML = `<div class="word-stack" style="align-items: ${align}"><div class="letter" style="font-size:150px">${word.split('').join('</div><div class="letter">')}</div></div>`;
}

async function loadData() { 
    try { 
        const res = await fetch(API_URL + "?t=" + Date.now()); 
        const data = await res.json(); 
        const words = (data[0] || "").trim().split(/\s+/); 
        renderWord("word1", words[0] || "", "flex-start"); 
        renderWord("word2", words[1] || "", "flex-end"); 
    } catch (e) {} 
}
setInterval(loadData, 3000); loadData();
</script>
</body>
</html>
