<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ETNIKA CUP — Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@900&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  padding: 0;
  font-family: "Poppins", sans-serif;
  background: radial-gradient(circle at top, #8b0000 0%, #2b0000 100%);
  color: #ffffff;
  display: flex;
  flex-direction: column;
  justify-content: center; 
  align-items: center;
  height: 100vh;
  text-align: center;
  overflow: hidden;
  position: relative;
}

/* Ефект мерехтіння зірок на фоні */
body::before {
  content: "";
  position: absolute;
  top: -10%; left: -10%; width: 120%; height: 120%;
  background-image: 
    radial-gradient(2px 2px at 40px 60px, #fff, rgba(0,0,0,0)),
    radial-gradient(3px 3px at 200px 300px, #ffdf8c, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 150px 400px, #fff, rgba(0,0,0,0)),
    radial-gradient(4px 4px at 400px 100px, #ff3030, rgba(0,0,0,0));
  background-size: 400px 400px;
  animation: bgPulse 6s infinite alternate ease-in-out;
  opacity: 0.5;
  z-index: 0;
}

@keyframes bgPulse {
  0% { opacity: 0.3; transform: scale(1) rotate(0deg); }
  100% { opacity: 0.7; transform: scale(1.1) rotate(1deg); }
}

header {
  margin-bottom: 20px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Налаштування для збільшеного логотипу */
.logo-etnika-cup-img {
  max-width: 95%;
  width: 850px; 
  height: auto;
  filter: 
    drop-shadow(0 0 15px rgba(255, 255, 255, 0.4))
    drop-shadow(0 0 35px rgba(255, 69, 0, 0.5));
}

.scoreboard {
  background: rgba(255, 255, 255, 0.07);
  border: 5px solid #000000; 
  border-radius: 40px;
  padding: 40px 40px; 
  box-shadow: 0 0 80px rgba(255, 0, 0, 0.3), inset 0 0 20px rgba(255, 69, 0, 0.2);
  backdrop-filter: blur(20px);
  min-width: 85%; 
  margin-top: 10px;
  margin-bottom: 50px; /* ДОДАНО ВІДСТУП ВІД РАМКИ ДО ТЕКСТУ ВНИЗУ */
  display: flex;
  flex-direction: column;
  justify-content: center; 
  transition: filter 0.5s ease-in-out, opacity 0.5s ease-in-out;
  z-index: 10;
}

.cell-container {
  display: flex;
  flex-direction: column;
  gap: 10px; 
}

.cell {
  color: #ffffff; 
  font-weight: 900; 
  line-height: 1.1;
  text-shadow: 
    0 0 10px rgba(255, 255, 255, 0.4),
    0 0 20px rgba(255, 69, 0, 0.8),
    0 0 40px rgba(139, 0, 0, 0.6),
    4px 4px 15px rgba(0, 0, 0, 0.8);
}

.name-row {
  font-size: 7.5em; 
  text-transform: uppercase;
  letter-spacing: 4px;
}

.club-row {
  font-size: 4.8em; 
  opacity: 0.95;
  color: #ffe0e0;
}

/* ЛОГОТИП Est Events У ВЕРХНЬОМУ ПРАВОМУ КУТІ */
.logo-estevents {
  position: absolute;
  top: 30px;
  right: 40px;
  width: 180px;
  height: auto;
  z-index: 20;
  opacity: 0.9;
  filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
}

footer {
  position: absolute;
  bottom: 25px;
  color: #ffcccc;
  font-size: 1.1em; 
  font-weight: 600;
  opacity: 0.7;
  z-index: 10;
}

@media (max-width: 768px) {
  .logo-etnika-cup-img { width: 320px; }
  .name-row { font-size: 2.2em; }
  .club-row { font-size: 1.4em; }
  .scoreboard { margin-top: 15px; margin-bottom: 30px; padding: 25px 15px; }
  .logo-estevents { width: 100px; top: 15px; right: 15px; }
  footer { bottom: 10px; font-size: 0.8em; }
}
</style>
</head>
<body>

<img src="logo_estevents.png.png" alt="EstEvents Logo" class="logo-estevents">

<header>
  <img src="Lemberg Cup.png" alt="ETNIKA CUP Logo" class="logo-etnika-cup-img">
</header>

<div class="scoreboard" id="scoreboard">
  <div id="content" class="cell-container">
    <div class="cell">ЗАВАНТАЖЕННЯ...</div>
  </div>
</div>

<footer>© 2026 EstEvents by Емма Щелецька</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyhuV7wnJIyk0oSdbLR1_np0DS47acXlRAnwTEV7MczrJlfn9GZvOMRTNYkjYciKdFu/exec";
let lastData = "";

async function loadData() {
  const scoreboard = document.getElementById("scoreboard");
  const content = document.getElementById("content");

  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    if (!res.ok) return;

    const data = await res.json();
    if (!Array.isArray(data)) return;

    const name = String(data[0] || "").trim();
    const club = String(data[1] || "").trim();
    const currentFullString = name + club;

    if (currentFullString === lastData) return;
    
    lastData = currentFullString;

    scoreboard.style.filter = "blur(10px)";
    scoreboard.style.opacity = "0.7";

    setTimeout(() => {
      content.innerHTML = `
        <div class="cell name-row">${name || "—"}</div>
        <div class="cell club-row">${club || "—"}</div>
      `;
      scoreboard.style.filter = "blur(0)";
      scoreboard.style.opacity = "1";
    }, 400);

  } catch (e) { console.error("Error fetching data:", e); }
}

loadData();
setInterval(loadData, 3000); 
</script>

</body>
</html>
