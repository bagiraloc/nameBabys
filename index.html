<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>Lemberg Cup — P-Screen</title>
<style>
  body { margin: 0; background: #061a0f; color: #fff; font-family: "Poppins", sans-serif; overflow: hidden; }

  /* Фон з зірками */
  body::after {
    content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0;
    background-image: 
      radial-gradient(1.5px 1.5px at 10% 10%, #FFD700, transparent),
      radial-gradient(1px 1px at 30% 60%, #fff, transparent);
    background-size: 400px 400px;
    animation: starTwinkle 4s infinite alternate;
  }
  @keyframes starTwinkle { 0% { opacity: 0.3; } 100% { opacity: 1; } }

  .p-screen {
    display: grid;
    grid-template-columns: 168px 672px 168px;
    grid-template-rows: 168px 672px;
    width: 1008px; height: 840px; margin: 0 auto; position: relative; z-index: 1;
  }

  /* РОЖЕВА ЗОНА: Логотип тепер на всю ширину між стиками */
  .top-zone { 
    grid-column: 1 / 4; display: flex; align-items: center; justify-content: center; position: relative; 
  }
  .logo-top { width: 90%; max-height: 120px; object-fit: contain; }
  .copyright { 
    position: absolute; right: 20px; top: 10px; 
    font-size: 12px; color: #ffffff; opacity: 0.6; white-space: nowrap;
  }

  /* ЗЕЛЕНІ ЗОНИ */
  .side-zone { 
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 30px 10px; position: relative;
  }
  
  /* Контейнер для тексту, що дозволяє перенос */
  .text-wrapper {
    display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start;
    width: 100%; height: 500px; /* Місце до логотипу */
  }

  .text-stack { 
    font-weight: 900; color: #eb8eb7; text-transform: uppercase;
    font-size: 32px; text-align: center; line-height: 1.1; margin: 0 5px;
  }
  
  .logo-side { width: 100px; flex-shrink: 0; } /* Логотип не рухається */
</style>
</head>
<body>

<div class="p-screen">
  <div class="top-zone">
    <img src="Lemberg Cup.png" class="logo-top" alt="Logo">
    <div class="copyright">© 2026 EstEvents by Емма Щелецька</div>
  </div>

  <div class="side-zone">
    <div class="text-wrapper" id="name-field"></div>
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>

  <div class="center-zone"></div>

  <div class="side-zone">
    <div class="text-wrapper" id="club-field"></div>
    <img src="logo_estevents.png.png" class="logo-side" alt="Logo">
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyhuV7wnJIyk0oSdbLR1_np0DS47acXlRAnwTEV7MczrJlfn9GZvOMRTNYkjYciKdFu/exec";

function formatVertical(text) {
    // Розбиваємо на букви, але додаємо пробіл для перенесення слів
    return text.split('').map(char => `<div class="text-stack">${char === ' ' ? '<br><br>' : char}</div>`).join('');
}

async function loadData() {
  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    const data = await res.json();
    document.getElementById("name-field").innerHTML = formatVertical(data[0] || "");
    document.getElementById("club-field").innerHTML = formatVertical(data[1] || "");
  } catch (e) { console.error("Error:", e); }
}
setInterval(loadData, 3000);
loadData();
</script>
</body>
</html>
